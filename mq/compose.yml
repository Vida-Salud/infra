name: vidasalud-mq

services:
  rabbitmq-1:
    image: rabbitmq:4.2-management
    container_name: rabbitmq-1
    hostname: rabbitmq-1
    restart: always     # vuelve a arrancar solo si se reinicia la EC2
    ports:
      - "5672:5672"     # AMQP (lo usan notify y appointments)
      - "15672:15672"   # Consola web nodo 1
    environment:
      RABBITMQ_DEFAULT_USER: vidasalud
      RABBITMQ_DEFAULT_PASS: admin123
      RABBITMQ_ERLANG_COOKIE: "vidasalud_cluster_cookie"
    volumes:
      - rabbitmq_data_1:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
      - rabbitmq_cluster
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq-2:
    image: rabbitmq:4.2-management
    container_name: rabbitmq-2
    hostname: rabbitmq-2
    restart: always     # vuelve a arrancar solo si se reinicia la EC2
    ports:
      - "5673:5672"     # AMQP nodo 2
      - "15673:15672"   # Consola web nodo 2
    environment:
      RABBITMQ_DEFAULT_USER: vidasalud
      RABBITMQ_DEFAULT_PASS: admin123
      RABBITMQ_ERLANG_COOKIE: "vidasalud_cluster_cookie"   # MISMA cookie
    volumes:
      - rabbitmq_data_2:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
      - rabbitmq_cluster
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      rabbitmq-1:
        condition: service_healthy

volumes:
  rabbitmq_data_1:
  rabbitmq_data_2:

networks:
  rabbitmq_cluster:
    driver: bridge