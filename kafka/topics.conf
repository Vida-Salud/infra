# Topología Kafka de VidaSalud. Única fuente de verdad: la aplica scripts/crear-topicos.sh
# (servicio kafka-init del compose). Formato, una línea por tópico:
#
#   nombre | particiones | réplicas | config1=valor;config2=valor
#
# - 3 particiones: una por hilo consumidor (listener.concurrency=3) y orden por atención (clave = atencionId).
# - 3 réplicas + min.insync.replicas=2: con acks=all se tolera la caída de 1 broker sin perder escrituras.
# - segment.ms=1 día: el borrado y la compactación solo actúan sobre segmentos cerrados.
# - retention.ms: 7 d = 604800000 · 14 d = 1209600000 · 30 d = 2592000000

# Fuente de verdad de los eventos de la atención. Alimenta reportería y auditoría.
appointments.events|3|3|cleanup.policy=delete;retention.ms=604800000;min.insync.replicas=2;segment.ms=86400000

# Historial quién / qué / cuándo / desde dónde. Clave = eventId: compact deja una sola copia
# de cada entrada aunque se republique; delete la elimina a los 30 días.
audit.timeline|3|3|cleanup.policy=compact,delete;retention.ms=2592000000;min.insync.replicas=2;segment.ms=86400000

# Dead Letter Topics, uno por consumidor: <tópico de origen>.<consumidor>.DLT
appointments.events.report.DLT|3|3|cleanup.policy=delete;retention.ms=1209600000;min.insync.replicas=2;segment.ms=86400000
appointments.events.audit.DLT|3|3|cleanup.policy=delete;retention.ms=1209600000;min.insync.replicas=2;segment.ms=86400000
audit.timeline.audit.DLT|3|3|cleanup.policy=delete;retention.ms=1209600000;min.insync.replicas=2;segment.ms=86400000