name: vidasalud-apps

services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: vidasalud-oracle
    environment:
      ORACLE_PASSWORD: admin123
      APP_USER: vidasalud
      APP_USER_PASSWORD: admin123
    ports:
      - "1521:1521"
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10

  appointments:
    build:
      context: ../../ms-vidasalud-appointments
      dockerfile: Dockerfile
    container_name: vidasalud-appointments
    environment:
      DB_HOST: oracle
      DB_PORT: 1521
      DB_SERVICE: FREEPDB1
      DB_USERNAME: vidasalud
      DB_PASSWORD: admin123
      AZURE_TENANT_ID: 9832f4f3-52dd-4367-a3b0-b4437d223f58
      AZURE_CLIENT_ID: c0093a05-7296-42f7-b6e7-d263c3db2fb0
      AZURE_APP_ID_URI: api://c0093a05-7296-42f7-b6e7-d263c3db2fb0
      TZ: America/Santiago
      # RabbitMQ (productor): clúster de 2 nodos (infra/mq), se accede vía el host
      RABBITMQ_ADDRESSES: host.docker.internal:5672,host.docker.internal:5673
      RABBITMQ_USER: vidasalud
      RABBITMQ_PASS: admin123
    ports:
      - "8081:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      oracle:
        condition: service_healthy
    restart: on-failure

  notify:
    build:
      context: ../../ms-vidasalud-notify
      dockerfile: Dockerfile
    container_name: vidasalud-notify
    environment:
      TZ: America/Santiago
      # RabbitMQ (consumidor): mismo clúster de 2 nodos
      RABBITMQ_ADDRESSES: host.docker.internal:5672,host.docker.internal:5673
      RABBITMQ_USER: vidasalud
      RABBITMQ_PASS: admin123
      # Simulación de fallas (pacientes FALLA_TEMPORAL / FALLA_PERMANENTE) para la demo de DLQ
      NOTIFY_SIMULACION: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: on-failure

  catalog:
    build:
      context: ../../ms-vidasalud-catalog/ms-vidasalud-catalog
      dockerfile: Dockerfile
    container_name: vidasalud-catalog
    environment:
      DB_HOST: oracle
      DB_PORT: 1521
      DB_SERVICE: FREEPDB1
      DB_USERNAME: vidasalud
      DB_PASSWORD: admin123
      AZURE_TENANT_ID: 9832f4f3-52dd-4367-a3b0-b4437d223f58
      AZURE_CLIENT_ID: c0093a05-7296-42f7-b6e7-d263c3db2fb0
      AZURE_APP_ID_URI: api://c0093a05-7296-42f7-b6e7-d263c3db2fb0
      TZ: America/Santiago
    ports:
      - "8091:8091"
    depends_on:
      oracle:
        condition: service_healthy
    restart: on-failure

  bff:
    build:
      context: ../../ms-vidasalud-bff
      dockerfile: Dockerfile
    container_name: vidasalud-bff
    environment:
      AZURE_TENANT_ID: 9832f4f3-52dd-4367-a3b0-b4437d223f58
      AZURE_CLIENT_ID: c0093a05-7296-42f7-b6e7-d263c3db2fb0
      AZURE_APP_ID_URI: api://c0093a05-7296-42f7-b6e7-d263c3db2fb0
      APPOINTMENTS_URL: http://appointments:8081
      CATALOG_URL: http://catalog:8091
      TZ: America/Santiago
    ports:
      - "8090:8090"
    depends_on:
      - appointments
      - catalog
    restart: on-failure

  frontend:
    build:
      context: ../../frontend-vidasalud
      dockerfile: Dockerfile
      args:
        API_BASE_URL: http://localhost:8090
        REDIRECT_URI: http://localhost:4200
        POST_LOGOUT_REDIRECT_URI: http://localhost:4200
    container_name: vidasalud-frontend
    ports:
      - "4200:80"
    volumes:
      - ./nginx-local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - bff
    restart: on-failure