name: vidasalud-apps

x-azure: &azure
  AZURE_TENANT_ID: ${AZURE_TENANT_ID:?falta en .env}
  AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:?falta en .env}
  AZURE_APP_ID_URI: api://${AZURE_CLIENT_ID}

x-rabbit: &rabbit
  RABBITMQ_ADDRESSES: host.docker.internal:5672,host.docker.internal:5673
  RABBITMQ_USER: ${RABBITMQ_USER:-vidasalud}
  RABBITMQ_PASS: ${RABBITMQ_PASS:?falta en .env}

x-kafka: &kafka
  # Clúster de 3 brokers (infra/kafka); se accede vía el host, igual que RabbitMQ
  KAFKA_BOOTSTRAP_SERVERS: host.docker.internal:9092,host.docker.internal:9093,host.docker.internal:9094

services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: vidasalud-oracle
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?falta en .env}
      APP_USER: vidasalud
      APP_USER_PASSWORD: ${DB_PASSWORD:?falta en .env}
    ports:
      - "1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10

  appointments:
    build:
      context: ../../ms-vidasalud-appointments
      dockerfile: Dockerfile
    container_name: vidasalud-appointments
    environment:
      DB_HOST: oracle
      DB_PORT: 1521
      DB_SERVICE: FREEPDB1
      DB_USERNAME: vidasalud
      DB_PASSWORD: ${DB_PASSWORD}
      <<: [*azure, *rabbit, *kafka]
      TZ: America/Santiago
      # RabbitMQ (productor): clúster de 2 nodos (infra/mq), se accede vía el host
      # Kafka (productor): publica cada cambio de estado en appointments.events
    ports:
      - "8081:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      oracle:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: on-failure

  notify:
    build:
      context: ../../ms-vidasalud-notify
      dockerfile: Dockerfile
    container_name: vidasalud-notify
    environment:
      TZ: America/Santiago
      # RabbitMQ (consumidor): mismo clúster de 2 nodos
      <<: *rabbit
      # Simulación de fallas: NOTIFY_PERFIL=demo en .env (o en la línea de comandos) activa FALLA_TEMPORAL / FALLA_PERMANENTE
      SPRING_PROFILES_ACTIVE: ${NOTIFY_PERFIL:-}
      # SMTP: Mailpit en la red interna del compose
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mailpit
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8092/actuator/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: on-failure

  mailpit:
    image: axllent/mailpit:v1.30.5
    container_name: vidasalud-mailpit
    # Solo se publica la bandeja web; el SMTP (1025) lo usa notify por la red interna
    ports:
      - "8025:8025"
    restart: on-failure

  rabbit-admin:
    build:
      context: ../../ms-vidasalud-rabbit-admin
      dockerfile: Dockerfile
    container_name: vidasalud-rabbit-admin
    environment:
      <<: [*azure, *rabbit]
      TZ: America/Santiago
      # RabbitMQ: administra el mismo clúster de 2 nodos (infra/mq)
    ports:
      - "8093:8093"   # se prueba con Postman (JWT con rol Admin)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8093/actuator/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: on-failure

  catalog:
    build:
      context: ../../ms-vidasalud-catalog
      dockerfile: Dockerfile
    container_name: vidasalud-catalog
    environment:
      DB_HOST: oracle
      DB_PORT: 1521
      DB_SERVICE: FREEPDB1
      DB_USERNAME: vidasalud
      DB_PASSWORD: ${DB_PASSWORD}
      <<: *azure
      TZ: America/Santiago
    ports:
      - "8091:8091"
    depends_on:
      oracle:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8091/actuator/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: on-failure

  report:
    build:
      context: ../../ms-vidasalud-report
      dockerfile: Dockerfile
    # Sin container_name ni puerto publicado: así se puede escalar para ver el balanceo del
    # consumer group (docker compose up -d --scale report=2). Se consulta a través del BFF.
    environment:
      DB_HOST: oracle
      DB_PORT: 1521
      DB_SERVICE: FREEPDB1
      DB_USERNAME: vidasalud
      DB_PASSWORD: ${DB_PASSWORD}
      <<: [*azure, *kafka]
      TZ: America/Santiago
      # Kafka (consumidor): grupo report-kpis sobre appointments.events (DLT: appointments.events.report.DLT)
      JAVA_TOOL_OPTIONS: "-Xmx256m"
    expose:
      - "8094"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      oracle:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8094/actuator/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: on-failure

  audit:
    build:
      context: ../../ms-vidasalud-audit
      dockerfile: Dockerfile
    container_name: vidasalud-audit
    environment:
      DB_HOST: oracle
      DB_PORT: 1521
      DB_SERVICE: FREEPDB1
      DB_USERNAME: vidasalud
      DB_PASSWORD: ${DB_PASSWORD}
      <<: [*azure, *kafka]
      TZ: America/Santiago
      # Kafka: grupo vidasalud-audit (appointments.events -> audit.timeline)
      #        y grupo vidasalud-audit-timeline (audit.timeline -> Oracle)
      JAVA_TOOL_OPTIONS: "-Xmx256m"
    ports:
      - "8096:8096"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      oracle:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8096/actuator/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: on-failure

  kafka-admin:
    build:
      context: ../../ms-vidasalud-kafka-admin
      dockerfile: Dockerfile
    container_name: vidasalud-kafka-admin
    environment:
      <<: [*azure, *kafka]
      TZ: America/Santiago
      # Kafka: administra tópicos, configuraciones y grupos del clúster (infra/kafka)
      JAVA_TOOL_OPTIONS: "-Xmx256m"
    ports:
      - "8095:8095"   # se prueba con Postman (JWT con rol Admin)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8095/actuator/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: on-failure

  bff:
    build:
      context: ../../ms-vidasalud-bff
      dockerfile: Dockerfile
    container_name: vidasalud-bff
    environment:
      <<: *azure
      APPOINTMENTS_URL: http://appointments:8081
      CATALOG_URL: http://catalog:8091
      REPORT_URL: http://report:8094
      AUDIT_URL: http://audit:8096
      TZ: America/Santiago
    ports:
      - "8090:8090"
    depends_on:
      appointments:
        condition: service_healthy
      catalog:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/actuator/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: on-failure

  frontend:
    build:
      context: ../../frontend-vidasalud
      dockerfile: Dockerfile
      args:
        API_BASE_URL: http://localhost:8090
        REDIRECT_URI: http://localhost:4200
        POST_LOGOUT_REDIRECT_URI: http://localhost:4200
    container_name: vidasalud-frontend
    ports:
      - "4200:80"
    volumes:
      - ./nginx-local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - bff
    restart: on-failure

volumes:
  oracle_data:
