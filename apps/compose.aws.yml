name: vidasalud-deploy

x-azure: &azure
  AZURE_TENANT_ID: ${AZURE_TENANT_ID:?falta en .env}
  AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:?falta en .env}
  AZURE_APP_ID_URI: api://${AZURE_CLIENT_ID}

x-rabbit: &rabbit
  RABBITMQ_ADDRESSES: 10.0.8.187:5672,10.0.8.187:5673
  RABBITMQ_USER: ${RABBITMQ_USER:-vidasalud}
  RABBITMQ_PASS: ${RABBITMQ_PASS:?falta en .env}

services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: vidasalud-oracle
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?falta en .env}
      APP_USER: vidasalud
      APP_USER_PASSWORD: ${DB_PASSWORD:?falta en .env}
    ports:
      - "1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always

  appointments:
    build:
      context: ../../ms-vidasalud-appointments
      dockerfile: Dockerfile
    container_name: vidasalud-appointments
    environment:
      DB_HOST: oracle
      DB_PORT: 1521
      DB_SERVICE: FREEPDB1
      DB_USERNAME: vidasalud
      DB_PASSWORD: ${DB_PASSWORD}
      <<: [*azure, *rabbit]
      APPOINTMENTS_URL: http://appointments:8081
      TZ: America/Santiago
      # RabbitMQ (productor): clúster de 2 nodos en ec2-mq (IP privada, no cambia)
    ports:
      - "8081:8081"
    depends_on:
      oracle:
        condition: service_healthy
    restart: always

  notify:
    build:
      context: ../../ms-vidasalud-notify
      dockerfile: Dockerfile
    container_name: vidasalud-notify
    environment:
      TZ: America/Santiago
      # RabbitMQ (consumidor): mismo clúster en ec2-mq
      <<: *rabbit
      # Simulación de fallas (FALLA_TEMPORAL / FALLA_PERMANENTE) para la demo de DLQ
      NOTIFY_SIMULACION: "true"
      # SMTP: Mailpit en la red interna del compose
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      # RAM limitada: la EC2 tiene poca memoria libre
      JAVA_TOOL_OPTIONS: "-Xmx256m"
    depends_on:
      - mailpit
    restart: always

  mailpit:
    image: axllent/mailpit:v1.30.5
    container_name: vidasalud-mailpit
    environment:
      # Bandeja web protegida (queda expuesta a internet en AWS)
      MP_UI_AUTH: "vidasalud:${MAILPIT_PASS:?falta en .env}"
    # Solo se publica la bandeja web; el SMTP (1025) lo usa notify por la red interna
    ports:
      - "8025:8025"
    restart: always

  rabbit-admin:
    build:
      context: ../../ms-vidasalud-rabbit-admin
      dockerfile: Dockerfile
    container_name: vidasalud-rabbit-admin
    environment:
      <<: [*azure, *rabbit]
      TZ: America/Santiago
      # RabbitMQ: administra el clúster de ec2-mq (IP privada)
      # RAM limitada: la EC2 tiene poca memoria libre
      JAVA_TOOL_OPTIONS: "-Xmx256m"
    ports:
      - "8093:8093"   # se prueba con Postman (JWT con rol Admin)
    restart: always

  catalog:
    build:
      context: ../../ms-vidasalud-catalog/ms-vidasalud-catalog
      dockerfile: Dockerfile
    container_name: vidasalud-catalog
    environment:
      DB_HOST: oracle
      DB_PORT: 1521
      DB_SERVICE: FREEPDB1
      DB_USERNAME: vidasalud
      DB_PASSWORD: ${DB_PASSWORD}
      <<: *azure
      TZ: America/Santiago
    ports:
      - "8091:8091"
    depends_on:
      oracle:
        condition: service_healthy
    restart: always

  bff:
    build:
      context: ../../ms-vidasalud-bff
      dockerfile: Dockerfile
    container_name: vidasalud-bff
    environment:
      <<: *azure
      APPOINTMENTS_URL: http://appointments:8081
      CATALOG_URL: http://catalog:8091
      CORS_ORIGINS: ${FRONTEND_URL:?falta en .env}
      TZ: America/Santiago
    ports:
      - "8080:8090"   # el API Gateway llama al 8080
    depends_on:
      - appointments
      - catalog
    restart: always

  frontend:
    build:
      context: ../../frontend-vidasalud
      dockerfile: Dockerfile
      args:
        API_BASE_URL: ${API_BASE_URL:?falta en .env}
        REDIRECT_URI: ${FRONTEND_URL}
        POST_LOGOUT_REDIRECT_URI: ${FRONTEND_URL}
    container_name: vidasalud-frontend
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - bff
    restart: always

volumes:
  oracle_data:
